# Обратный прокси перед Go-сервером. Снаружи доступен только он:
# у app в docker-compose нет опубликованных портов.

# Не больше 20 запросов в секунду с одного IP (всплеск до 40) — защита от перебора и флуда.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

upstream app {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;            # не показывать версию nginx
    client_max_body_size 1m;      # как MaxBodyBytes в приложении

    # Медленные клиенты не держат соединения вечно.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          20s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json application/yaml text/css application/javascript;

    location / {
        limit_req zone=per_ip burst=40 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    25s;  # чуть больше WriteTimeout сервера (20 с)
    }

    # Healthcheck контейнера nginx: не трогает приложение и не пишется в лог.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
