name: pritti

# Снаружи открыт только nginx. app доступен лишь внутри сети compose,
# Postgres — только с этой машины (127.0.0.1), для `go run` и тестов.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pritti
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pritti"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/pritti?sslmode=disable
      APP_TZ: Europe/Moscow
      API_KEY: ${API_KEY:?задайте API_KEY в .env — см. README}
      # Локально миграции применяет сам сервер; на проде — отдельный шаг (server migrate).
      MIGRATE_ON_START: "true"
      # IP клиента для лимита запросов: его кладёт nginx (proxy_set_header X-Real-IP).
      REAL_IP_HEADER: X-Real-IP
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
